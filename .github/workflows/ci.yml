name: SentinelForge CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - develop

jobs:
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: sentinelforge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: backend
        run: |
          pip install --require-hashes --only-binary=:all: -r requirements.txt

      - name: Run database migrations
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://${{ secrets.POSTGRES_USER }}:${{ secrets.POSTGRES_PASSWORD }}@localhost:5432/sentinelforge
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
        run: |
          alembic upgrade head

      - name: Run backend tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://${{ secrets.POSTGRES_USER }}:${{ secrets.POSTGRES_PASSWORD }}@localhost:5432/sentinelforge
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
        run: |
          pytest

  installer-test:
    name: Installer & Compose Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate shell syntax
        run: |
          bash -n scripts/install.sh
          bash -n scripts/uninstall.sh
          bash -n scripts/tests/install-test.sh

      - name: Run ShellCheck
        run: |
          if command -v shellcheck >/dev/null 2>&1; then
            shellcheck --severity=warning \
              scripts/install.sh \
              scripts/uninstall.sh \
              scripts/tests/install-test.sh
          else
            echo "ShellCheck is not available on this runner; skipping."
          fi

      - name: Run installer test suite (Docker stubs)
        run: bash scripts/tests/install-test.sh

      - name: Validate Docker Compose configuration
        run: |
          docker compose \
            --env-file deploy/.env.example \
            -f deploy/docker-compose.yml \
            config --quiet

      - name: Verify database and cache are not published
        run: |
          if docker compose \
            --env-file deploy/.env.example \
            -f deploy/docker-compose.yml \
            config | grep -Eq 'published: "(5432|6379)"'; then
            echo "PostgreSQL or Redis must not publish a host port." >&2
            exit 1
          fi
          echo "Only the gateway publishes a host port."

      - name: Reject committed generated secrets
        run: |
          if grep -RnE '(POSTGRES_PASSWORD|JWT_SECRET_KEY)=[0-9a-f]{64}' \
            deploy/.env.example deploy/docker-compose.yml deploy/config/; then
            echo "A generated-looking secret is committed under deploy/." >&2
            exit 1
          fi
          echo "No generated secrets found in deploy/."

  security-audit:
    name: Security & Secret Leak Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Secret Leak & Security Audit
        run: |
          chmod +x ./scripts/check-secret-leaks.sh
          ./scripts/check-secret-leaks.sh

  docker-publish:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    needs: [backend-test, security-audit, installer-test]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            joypatel2403/sentinelforge-backend:latest
            joypatel2403/sentinelforge-backend:${{ github.sha }}

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            joypatel2403/sentinelforge-frontend:latest
            joypatel2403/sentinelforge-frontend:${{ github.sha }}
