# SentinelForge gateway configuration (nginx-unprivileged).
#
# Mounted at /etc/nginx/conf.d/default.conf. The image already runs as a
# non-root user and listens on the unprivileged port 8080.
#
# Routing:
#   /api/*  -> backend:8000   (FastAPI)
#   /*      -> frontend:3000  (Next.js)
#
# This gateway is required because Next.js rewrites are compiled at image
# build time; the published frontend image cannot be re-pointed at runtime.

server {
    listen 8080;
    server_name _;

    server_tokens off;
    client_max_body_size 10m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    proxy_http_version 1.1;
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass http://backend:8000;
    }

    location / {
        proxy_pass http://frontend:3000;
    }
}
