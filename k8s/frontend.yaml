apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: sentinelforge
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: joypatel2403/sentinelforge-frontend:latest
          ports:
            - containerPort: 3000
          env:
            - name: NEXT_PUBLIC_API_URL
              value: http://127.0.0.1:36533

---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: sentinelforge
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30080