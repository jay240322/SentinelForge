apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: sentinelforge
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      automountServiceAccountToken: false
      containers:
        - name: postgres
          image: postgres:17-alpine
          ports:
            - containerPort: 5432

          env:
            - name: POSTGRES_USER
              value: sentinelforge

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sentinelforge-postgres-secret
                  key: POSTGRES_PASSWORD

            - name: POSTGRES_DB
              value: sentinelforge

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
              ephemeral-storage: "512Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
              ephemeral-storage: "1Gi"

          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data

      volumes:
        - name: postgres-data
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: sentinelforge
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432