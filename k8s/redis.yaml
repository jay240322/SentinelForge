apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: sentinelforge
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      automountServiceAccountToken: false
      containers:
        - name: redis
          image: redis:8-alpine
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
              ephemeral-storage: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
              ephemeral-storage: "256Mi"

---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: sentinelforge
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379