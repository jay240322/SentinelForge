# ==============================================================================
# SentinelForge - Declarative Kubernetes Secrets Template
# WARNING: DO NOT COMMIT REAL SECRETS TO VERSION CONTROL!
#
# This file serves as a reference template for operators who require declarative
# manifest management or GitOps external secret injection pipelines.
#
# DO NOT apply this file directly with placeholder values.
#
# Standard Operator Installation Options:
#   Option 1 (Automated CLI):
#     ./scripts/manage-secrets.sh apply --generate-missing
#
#   Option 2 (From secure uncommitted .env.secrets):
#     ./scripts/manage-secrets.sh apply --from-env .env.secrets
#
#   Option 3 (Generate declarative manifest locally for inspection):
#     ./scripts/manage-secrets.sh generate --output-yaml /path/outside/git/secrets.yaml
#     kubectl apply -f /path/outside/git/secrets.yaml
# ==============================================================================

apiVersion: v1
kind: Secret
metadata:
  name: sentinelforge-postgres-secret
  namespace: sentinelforge
  labels:
    app.kubernetes.io/name: sentinelforge
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: sentinelforge
type: Opaque
stringData:
  # Strong random password for PostgreSQL superuser (e.g. openssl rand -base64 24)
  # IMPORTANT: Must match the password in sentinelforge-database-secret DATABASE_URL.
  POSTGRES_PASSWORD: "CHANGE_ME_SECURE_POSTGRES_PASSWORD"

---
apiVersion: v1
kind: Secret
metadata:
  name: sentinelforge-database-secret
  namespace: sentinelforge
  labels:
    app.kubernetes.io/name: sentinelforge
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: sentinelforge
type: Opaque
stringData:
  # SQLAlchemy Async connection string consumed by backend
  # Format: postgresql+asyncpg://<POSTGRES_USER>:<POSTGRES_PASSWORD>@<POSTGRES_HOST>:<PORT>/<POSTGRES_DB>
  DATABASE_URL: "postgresql+asyncpg://sentinelforge:CHANGE_ME_SECURE_POSTGRES_PASSWORD@postgres:5432/sentinelforge"

---
apiVersion: v1
kind: Secret
metadata:
  name: sentinelforge-backend-secret
  namespace: sentinelforge
  labels:
    app.kubernetes.io/name: sentinelforge
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: sentinelforge
type: Opaque
stringData:
  # Cryptographic secret key for signing access & refresh JWT tokens (HMAC-SHA256)
  # Minimum recommended length: 32 bytes (64 hex characters or 44 base64 characters)
  # Generate with: openssl rand -hex 32
  JWT_SECRET_KEY: "CHANGE_ME_64_CHAR_HEX_RANDOM_SECRET_KEY"

  # JWT signing algorithm (default: HS256)
  JWT_ALGORITHM: "HS256"

  # Access token lifespan in minutes (default: 15)
  ACCESS_TOKEN_EXPIRE_MINUTES: "15"

  # Refresh token lifespan in days (default: 7)
  REFRESH_TOKEN_EXPIRE_DAYS: "7"
